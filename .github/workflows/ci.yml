name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sums_test
          POSTGRES_USER: sums
          POSTGRES_PASSWORD: sums_ci_database_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sums -d sums_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sums:sums_ci_database_only@127.0.0.1:5432/sums_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 7
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:4173
      SEED_DEMO_PASSWORD: SumsCi!2026
      E2E_DEMO_PASSWORD: SumsCi!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run prisma:validate --workspace=@sums/api
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e --workspace=@sums/api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: |
          npm run start --workspace=@sums/api > api.log 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4173 > web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/v1/health/ready && break || sleep 2; done
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 && break || sleep 2; done
          npm run test:e2e
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            api.log
            web.log
            playwright-report
            test-results
